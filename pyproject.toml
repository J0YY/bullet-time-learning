[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bullet-time-learning"
version = "0.1.0"
description = "Controlled exact-image video pretraining and frozen-readout pilot"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.3.5", "Pillow==12.0.0", "torch==2.9.1", "torchvision==0.24.1", "timm==1.0.22"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
bullet-time = "bullet_time.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.setuptools.package-data]
"bullet_time.models.videomae_upstream" = ["LICENSE", "NOTICE.md", "upstream.json"]
