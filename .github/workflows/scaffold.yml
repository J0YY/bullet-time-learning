name: Scaffold checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Original spec import is retained for provenance checks.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_scaffold.py
      - name: Check proposal grid identities and workload arithmetic
        run: python3 scripts/audit_spec.py
      - name: Check pilot counts, rejected malformed plans and current audit hashes
        run: python3 scripts/check_pilot_plan.py --self-test --check-report
      - name: Check all tracked whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime and consumer package
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements-lock.txt -e '.[test]'
          python -m pip check
      - run: ruff check src tests --select F
      - run: ruff format --check src tests
      - name: Check real model/update/readout code against synthetic fixtures
        run: python -m pytest -q
